const LOCAL=(()=>{

const clean=(s,n=300)=>String(s??"").replace(/[<>]/g,"").trim().slice(0,n);

async function hashPw(pw,salt){const s=salt||hex(16);const key=await crypto.subtle.importKey("raw",enc.encode(String(pw)),"PBKDF2",false,["deriveBits"]);const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(s),iterations:100000,hash:"SHA-256"},key,256);return s+":"+Array.from(new Uint8Array(bits),x=>x.toString(16).padStart(2,"0")).join("")}

const tempPassword=()=>{const c="abcdefghjkmnpqrstuvwxyz23456789";return Array.from(crypto.getRandomValues(new Uint8Array(10)),x=>c[x%c.length]).join("")};

    vouches:vs.length,rating:vs.length?Math.round((vs.reduce((s,v)=>s+v.rating,0)/vs.length)*100)/100:0,

}
const linkStatus=l=>(l.status==="active"&&l.expiresAt<Date.now()?"expired":l.status);

R("POST","login",async r=>{const name=clean(r.body.username,20).toLowerCase(),pw=String(r.body.password||"");
  const f=failures[name];if(f&&f.until>Date.now())throw new Err(429,"Too many wrong attempts. Wait 15 minutes and try again.");
  const u=db.users.find(x=>x.name.toLowerCase()===name);
  if(!u||!(await checkPw(pw,u.pw))){const n=(f?.n||0)+1;failures[name]={n,until:n>=5?Date.now()+15*6e4:0};throw new Err(401,"Wrong username or password.")}

R("POST","register",async r=>{const name=clean(r.body.username,20),pw=String(r.body.password||"");

  const first=db.users.length===0;const u={id:"BT-"+(1001+db.users.length),name,role:first?"Owner":"Member",bio:"Bunny Team member.",mm:first,status:"online",avatar:null,banner:null,hue:Math.floor(Math.random()*360),joined:new Date().toISOString().slice(0,10),pw:await hashPw(pw)};
  db.users.push(u);log(u,"Created account");const t=token();db.sessions[t]=u.id;return{token:t,user:{...pub(u),rank:RANK[u.role]}}});
R("POST","logout",r=>{delete db.sessions[r.tok];return{ok:true}});
R("PATCH","me",r=>{need(r.me,2);const b=r.body,n=clean(b.name,20);
  if(b.name!==undefined){if(n.length<2)throw new Err(400,"Username needs 2–20 characters.");if(db.users.some(u=>u.id!==r.me.id&&u.name.toLowerCase()===n.toLowerCase()))throw new Err(409,"That username is taken.");r.me.name=n}
  if(b.bio!==undefined)r.me.bio=clean(b.bio,200);

  if(b.comm!==undefined){if(b.comm===null||b.comm==="")r.me.comm=undefined;else{const c=Number(b.comm);if(!(c>=0&&c<=100))throw new Err(400,"Commission must be 0 to 100.");r.me.comm=Math.round(c*10)/10}}log(r.me,"Updated profile");return pub(r.me)});
R("POST","users/:id/role",r=>{need(r.me,MIN_ROLES);const t=userById(r.params.id),role=r.body.role;
  if(!t||!(role in RANK))throw new Err(400,"Unknown account or role.");

R("POST","users",async r=>{need(r.me,MIN_ROLES);const name=clean(r.body.name,20),role=r.body.role;
  if(name.length<2)throw new Err(400,"Username needs 2–20 characters.");if(!(role in RANK)||RANK[role]>=RANK[r.me.role])throw new Err(403,"You can only give roles below your own.");
  if(db.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))throw new Err(409,"That username is taken.");
  const tmp=tempPassword(),id="BT-"+(1001+db.users.length);db.users.push({id,name,role,bio:"Bunny Team member.",mm:RANK[role]>=MIN_LINK,status:"online",avatar:null,banner:null,hue:Math.floor(Math.random()*360),joined:new Date().toISOString().slice(0,10),pw:await hashPw(tmp)});

R("POST","links",r=>{need(r.me,MIN_LINK);const type=r.body.type==="vouch"?"vouch":"verify";const l=mk(r.me,type,r.body.ref,minutesOf(r.body,type));db.links.unshift(l);log(r.me,"Created "+type+" link",l.id+" ref "+l.ref);return pubLink(l)});
R("POST","links/batch",r=>{need(r.me,MIN_LINK);const n=Math.floor(Number(r.body.count));if(!(n>=1&&n<=25))throw new Err(400,"Choose 1–25 links.");
  const m=minutesOf(r.body,"verify"),refs=String(r.body.refs||"").split("\n").map(s=>s.trim()).filter(Boolean),bid=rid("BT"),out=[];
  for(let i=0;i<n;i++){const l=mk(r.me,"verify",refs[i]||(clean(r.body.ref,50)||"BATCH")+"-"+(i+1),m,bid);db.links.unshift(l);out.push(pubLink(l))}

R("POST","vouch/:t",r=>{const l=byToken(r.params.t,"vouch");if(linkStatus(l)!=="active")throw new Err(410,"This vouch link is no longer active.");

R("GET","vouches",r=>{need(r.me,MIN_LINK);return db.vouches.filter(v=>v.mm===r.me.id||RANK[r.me.role]>=MIN_REVIEW).map(v=>({...v,mmName:userById(v.mm)?.name}))});

  if(t.mm!==r.me.id&&RANK[r.me.role]<MIN_REVIEW)throw new Err(403,"Only the assigned middleman or a Moderator+ can change this trade.");

async function handle(method,path,body,tok){
  await load();
  const p=decodeURIComponent(path.split("?")[0]).replace(/^\/+/,"");
  const id=tok&&db.sessions[tok];
  const me=id?userById(id):null;
  let hit=null;
  for(const[m,re,fn]of routes){if(m!==method)continue;const mm=re.exec(p);if(mm){hit=[fn,mm.groups||{}];break}}
  if(!hit)throw new Err(404,"Not found.");
  try{const out=await hit[0]({me,tok,body:body||{},params:hit[1]});save();return JSON.parse(JSON.stringify(out===undefined?{ok:true}:out))}
  catch(e){save();throw e}
}
return{handle};

async function tradesTab(){if(ME.rank<3)return `<div class="card"><p>Trade management is for staff. Ask a Trial Mod or higher for help with a trade.</p></div>`;const T=await api("/trades"),s=ME.stats;window._T=T;
return `<div class="grid g3">${[["Total holds",s.holds],["Completed holds",s.holdsDone],["Pending holds",s.holdsPending],["Completed commission",usd(s.commission)],["Pending commission",usd(s.commissionPending)],["Completed sales",usd(s.sales)]].map(([l,v])=>`<div class="stat card" style="margin:0"><b>${v}</b><span>${l}</span></div>`).join("")}</div><div class="sec"><h3 class="sp">Transactions</h3><button class="btn sm" onclick="tradeForm()">New trade</button></div><p class="sub" style="margin:0 0 10px">Only Completed trades count toward official statistics.</p>${T.slice(0,25).map(t=>`<div class="li"><div><div class="t">${esc(t.id)} <span class="chip ${TC[t.status]}">${t.status}</span></div><div class="m">${esc(t.buyer)} ⇄ ${esc(t.seller)} · ${esc(t.items.join(", "))} · ${usd(t.commission)}</div></div><div class="b"><button class="btn sm soft" onclick="tradeModal('${t.id}')">Details</button><select aria-label="Change status" onchange="setTrade('${t.id}',this.value)">${["Pending","In Progress","Completed","Cancelled","Disputed"].map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select></div></div>`).join("")}`}
function tradeModal(id){const t=_T.find(x=>x.id===id);modal(`<h2>Transaction details</h2><div style="margin:10px 0"><div class="kv"><span>Transaction ID</span><b>${esc(t.id)}</b></div><div class="kv"><span>Assigned middleman</span><b>${esc(t.mmName)}</b></div><div class="kv"><span>Type</span><b>Middleman · ${t.game}</b></div><div class="kv"><span>Created</span><b>${dt(t.at)}</b></div><div class="kv"><span>Buyer / Seller</span><b>${esc(t.buyer)} / ${esc(t.seller)}</b></div><div class="kv"><span>Items</span><b>${esc(t.items.join(", "))}</b></div><div class="kv"><span>Commission</span><b>${usd(t.commission)}${t.hold?" · hold":""}</b></div><div class="kv"><span>Verification</span><span class="chip ${t.verifRef?"ok":""}">${t.verifRef?"Verified · "+esc(t.verifRef):"Not linked"}</span></div><div class="kv"><span>Status</span><span class="chip ${TC[t.status]}">${t.status}</span></div></div><h3>Activity</h3><div class="tl">${[...(t.events||[]),...(t.evidence||[]).map(e=>({text:"Note by "+e.by+": "+e.note,at:e.at}))].sort((a,b)=>a.at-b.at).map(e=>`<div>${esc(e.text)}<br><span class="mut">${dt(e.at)}</span></div>`).join("")}</div><button class="btn soft" onclick="modal('')">Close</button>`)}
function tradeForm(){modal(`<h2>New trade</h2><div class="form"><div><label>Buyer</label><input id="tb"></div><div><label>Seller</label><input id="ts"></div><div><label>Game</label><select id="tg"><option>ADM</option><option>MM2</option></select></div><div><label>Items (comma separated)</label><input id="ti"></div><div><label>Value (USD)</label><input id="tv" type="number" min="0"></div><div><label>Verification ref</label><input id="tx"></div></div><label><input type="checkbox" id="th" style="width:auto"> Middleman is holding items</label><div class="row" style="margin-top:14px"><button class="btn" onclick="newTrade()">Create trade</button><button class="btn soft" onclick="modal('')">Cancel</button></div>`)}
const newTrade=guard(async()=>{await api("/trades","POST",{buyer:$("#tb").value,seller:$("#ts").value,game:$("#tg").value,items:$("#ti").value,value:$("#tv").value,verifRef:$("#tx").value,hold:$("#th").checked});modal("");await boot(true);toast("Trade created")});
const setTrade=guard(async(id,status)=>{const note=status==="Disputed"||status==="Cancelled"?prompt("Evidence or note (optional)")||"":"";await api("/trades/"+id+"/status","POST",{status,note});MMS=await api("/mms");await boot(true);toast("Trade updated")});
async function staffTab(){const [V,R,T,AL]=await Promise.all([api("/vouches"),api("/reports"),api("/trades"),api("/links")]),sec=tab.sf||"vouches";let h=`<div class="grid g3" style="margin-bottom:14px">${[["Open reports",R.filter(x=>x.status==="open").length],["Pending vouches",V.filter(x=>x.status==="pending").length],["Disputed trades",T.filter(x=>x.status==="Disputed").length],["Active links",AL.filter(x=>x.status==="active").length]].map(([l,v])=>`<div class="stat card" style="margin:0"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`+tabs("sf",[["vouches","Vouch review"],["reports","Reports"],...(ME.rank>=6?[["logs","Activity log"]]:[]),...(ME.rank>=8?[["roles","Roles"]]:[])],"vouches");
if(sec==="vouches")h+=`<div class="card">${V.map(v=>`<div class="li" style="flex-wrap:wrap"><div style="flex:1 1 100%"><b>${esc(v.customer)}</b> → ${esc(v.mmName)} <span style="color:#e0a43a">${stars(v.rating)}</span><br>${esc(v.text)}<br><span class="mut">${esc(v.txRef)} · ${dt(v.at)}</span>${v.proof?`<br><img src="${esc(v.proof)}" alt="proof" style="max-width:120px;border-radius:10px">`:""}</div><div class="b" style="margin:0"><select onchange="vstat('${v.id}',this.value)">${["pending","verified","rejected","under-review"].map(x=>`<option ${x===v.status?"selected":""}>${x}</option>`).join("")}</select></div></div>`).join("")}</div>`;
if(sec==="reports")h+=`<div class="card">${R.map(r=>`<div class="li" style="flex-wrap:wrap"><div style="flex:1 1 100%"><b>${esc(r.id)}</b> <span class="chip">${esc(r.category)}</span> on ${esc(r.target||"—")}<br>${esc(r.description)}<br><span class="mut">by ${esc(r.by)} · ${dt(r.at)} · ${esc(r.evidence)}</span>${r.image?`<br><img src="${esc(r.image)}" alt="evidence" style="max-width:120px;border-radius:10px">`:""}</div><div class="b" style="margin:0"><select onchange="rstat('${r.id}',this.value)">${["open","reviewing","resolved","dismissed"].map(x=>`<option ${x===r.status?"selected":""}>${x}</option>`).join("")}</select></div></div>`).join("")||'<p class="empty">No reports yet.</p>'}</div>`;
if(sec==="logs"){const G=await api("/logs");h+=`<div class="card tbl"><table><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th></tr>${G.map(g=>`<tr><td>${dt(g.at)}</td><td>${esc(g.actor)}</td><td>${esc(g.action)}</td><td>${esc(g.detail)}</td></tr>`).join("")}</table></div>`}
if(sec==="roles"){const us=(await api("/users")).sort((a,b)=>RK[b.role]-RK[a.role]),opts=Object.keys(RK).filter(x=>RK[x]<ME.rank);h+=`<div class="card"><h3>Add a member</h3><p class="mut">Create an account and give it a role below yours${ME.role==="Owner"?". As Owner, you are the only one who can name a Co-Owner":""}.</p><div class="form"><div><label>Username</label><input id="nu" maxlength="20"></div><div><label>Role</label><select id="nr">${opts.map(x=>`<option ${x==="Member"?"selected":""}>${x}</option>`).join("")}</select></div></div><button class="btn" style="margin-top:12px" onclick="addUser()">Add member</button></div><div class="sec"><h3>Team roles</h3></div>${us.map(u=>`<div class="li">${av(u,40)}<div><div class="t">${esc(u.name)}</div><div class="m">${esc(u.id)}</div></div><div class="b">${RK[u.role]<ME.rank?`<select aria-label="Role for ${esc(u.name)}" onchange="setRole('${u.id}',this.value)">${opts.map(x=>`<option ${x===u.role?"selected":""}>${x}</option>`).join("")}</select>`:`<span class="chip">${esc(u.role)}</span>`}</div></div>`).join("")}`}return h}

const rstat=guard(async(id,status)=>{await api("/reports/"+id+"/status","POST",{status});toast("Report "+status)});

/* ---------- router ---------- */
async function route(){clearInterval(tick);const p=location.pathname,m=p.match(/^\/(verify|vouch)\/([\w-]+)$/)||location.hash.match(/^#(verify|vouch)-([\w-]+)$/);
try{if(m){document.body.classList.add("nonav");$("#nav").style.display="none";$("#who").textContent="Customer page";return m[1]==="verify"?await verifyPage(m[2]):await vouchPage(m[2])}
if(!ME){document.body.classList.add("nonav");$("#nav").style.display="none";$("#who").textContent="Visitor";$("#view").innerHTML=gateHTML();scrollTo(0,0);return}
document.body.classList.remove("nonav");$("#nav").style.display="";$("#who").textContent=ME?ME.name:"Visitor";const pg=(location.hash||"#home").slice(1),k=PAGES.some(x=>x[0]===pg)?pg:"home";drawNav(k);let h="";
if(k==="home")h=await home();if(k==="leaderboard")h=leaderboard();if(k==="find")h=find();if(k==="market")h=market();if(k==="profile")h=await profile();
const sameP=k===route.last,y=scrollY,keep={};document.querySelectorAll("#view input[id],#view select[id],#view textarea[id]").forEach(el=>{if(el.type!=="file"&&el.type!=="password")keep[el.id]=el.type==="checkbox"?el.checked:el.value});$("#view").innerHTML=h;route.last=k;for(const id in keep){const el=document.getElementById(id);if(el){if(el.type==="checkbox")el.checked=keep[id];else el.value=keep[id]}}scrollTo(0,sameP?y:0);
if(k==="find"){$("#fq").oninput=e=>{tab.q=e.target.value;route();setTimeout(()=>{const i=$("#fq");i.focus();i.setSelectionRange(99,99)})};$("#fa").onchange=e=>setTab("av",e.target.value);$("#fs").onchange=e=>setTab("sort",e.target.value)}
if(k==="market"){const t=tab.market||"adm";if($("#iq"))$("#iq").oninput=e=>{tab.iq=e.target.value;route();setTimeout(()=>{const i=$("#iq");i.focus();i.setSelectionRange(99,99)})};if($("#mu"))$("#mu").onchange=e=>setTab("mu",e.target.value);if(t==="listings"){drawListings();$("#lq").oninput=e=>{tab.lq=e.target.value;drawListings()};$("#lg").onchange=e=>{tab.lg=e.target.value;drawListings()};$("#lt").onchange=e=>{tab.lt=e.target.value;drawListings()}}}
}catch(e){$("#view").innerHTML=`<div class="card"><h3>Couldn't load this page</h3><p class="mut">${esc(e.message)}</p><button class="btn" style="margin-top:8px" onclick="route()">Try again</button></div>`}}
async function boot(skip){try{[OV,MMS,CAT]=await Promise.all([api("/overview"),api("/mms"),api("/catalog")]);IT={adm:CAT.adm,mm2:CAT.mm2};FEES=CAT.fees;ME=TOK?await api("/me").catch(()=>{TOK="";ss.del("bt");return null}):null}catch(e){console.error("Load failed:",e)}
$("#who").textContent=ME?ME.name:"Visitor";$("#who").onclick=()=>go("profile");await route()}
function enhance(){document.querySelectorAll("select:not([data-e])").forEach(sl=>{sl.dataset.e=1;const b=document.createElement("button");b.type="button";b.className="sel";const sync=()=>{b.textContent=sl.options[sl.selectedIndex]?.text||""};sync();sl.addEventListener("change",sync);b.onclick=()=>openSheet(sl,sync);b.setAttribute("aria-label",sl.getAttribute("aria-label")||"Choose an option");sl.style.display="none";sl.after(b)})}
function openSheet(sl,sync){const o=[...sl.options];$("#sheet").innerHTML=`<div class="sb" onclick="if(event.target===this)$('#sheet').innerHTML=''"><div class="sp2">${o.map((x,i)=>`<button type="button" class="opt ${i===sl.selectedIndex?"on":""}" data-i="${i}"><i></i>${esc(x.text)}</button>`).join("")}</div></div>`;$("#sheet").querySelectorAll(".opt").forEach(bn=>bn.onclick=()=>{sl.selectedIndex=+bn.dataset.i;$("#sheet").innerHTML="";sync();sl.dispatchEvent(new Event("change",{bubbles:true}))})}
new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
function wflFrom(g,i){const n=IT[g][i][0];WFL[g].a.push({n,m:g==="adm"?(tab.mu||"Normal"):"",q:1});tab.market="wfl"+g;toast(n+" added to your side");route()}
addEventListener("hashchange",route);(async()=>{await detectServer();await boot()})();
